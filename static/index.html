<!DOCTYPE html>
<html lang="zh-CN">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>AI 门卫室 </title>
        <style>
                *,
                *::before,
                *::after {
                        box-sizing: border-box;
                        -webkit-tap-highlight-color: transparent;
                }

                :root {
                        --bg: #050b16;
                        --bg2: #081020;
                        --card: rgba(255, 255, 255, 0.035);
                        --card-hover: rgba(255, 255, 255, 0.06);
                        --border: rgba(255, 255, 255, 0.07);
                        --border-hi: rgba(47, 128, 255, 0.3);
                        --blue: #2f80ff;
                        --blue-dark: #1a5fdd;
                        --blue-glow: rgba(47, 128, 255, 0.22);
                        --cyan: #00d4ff;
                        --green: #00e676;
                        --green-dark: #00c853;
                        --red: #ff4444;
                        --text: #e8eeff;
                        --text-sub: rgba(232, 238, 255, 0.42);
                        --text-dim: rgba(232, 238, 255, 0.2);
                        --radius-lg: 20px;
                        --radius-md: 14px;
                }

                body {
                        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
                        margin: 0;
                        padding: 0;
                        background: var(--bg);
                        min-height: 100vh;
                        color: var(--text);
                        overflow-x: hidden;
                        -webkit-font-smoothing: antialiased;
                }

                body::before {
                        content: '';
                        position: fixed;
                        inset: 0;
                        z-index: 0;
                        pointer-events: none;
                        background-image:
                                linear-gradient(rgba(47, 128, 255, 0.025) 1px, transparent 1px),
                                linear-gradient(90deg, rgba(47, 128, 255, 0.025) 1px, transparent 1px);
                        background-size: 48px 48px;
                        mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 30%, transparent 100%);
                }

                body::after {
                        content: '';
                        position: fixed;
                        top: -200px;
                        left: 50%;
                        transform: translateX(-50%);
                        width: 700px;
                        height: 500px;
                        z-index: 0;
                        pointer-events: none;
                        background: radial-gradient(ellipse, rgba(47, 128, 255, 0.07) 0%, transparent 70%);
                }

                #idlePage {
                        position: relative;
                        z-index: 1;
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        justify-content: space-between;
                        min-height: 100vh;
                        padding: 0 0 max(48px, env(safe-area-inset-bottom, 48px));
                        opacity: 1;
                        transition: opacity 0.32s ease, transform 0.32s ease;
                }

                #idlePage.fading-out {
                        opacity: 0;
                        transform: scale(0.96) translateY(-8px);
                }

                .top-bar {
                        width: 100%;
                        display: flex;
                        align-items: center;
                        justify-content: space-between;
                        padding: 52px 24px 0;
                }

                .logo {
                        display: flex;
                        align-items: center;
                        gap: 10px;
                }

                .logo-mark {
                        width: 32px;
                        height: 32px;
                        background: linear-gradient(135deg, #2f80ff, #00d4ff);
                        border-radius: 9px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        box-shadow: 0 2px 12px rgba(47, 128, 255, 0.35);
                }

                .logo-mark svg {
                        width: 18px;
                        height: 18px;
                }

                .logo-name {
                        font-size: 15px;
                        font-weight: 700;
                        color: var(--text);
                        letter-spacing: -0.2px;
                }

                .status-pill {
                        display: flex;
                        align-items: center;
                        gap: 6px;
                        background: rgba(0, 230, 118, 0.08);
                        border: 1px solid rgba(0, 230, 118, 0.18);
                        border-radius: 100px;
                        padding: 5px 12px 5px 8px;
                        font-size: 11px;
                        font-weight: 600;
                        color: var(--green);
                        letter-spacing: 0.3px;
                }

                .dot {
                        width: 6px;
                        height: 6px;
                        border-radius: 50%;
                        background: var(--green);
                        box-shadow: 0 0 8px var(--green);
                        animation: dotPulse 2.4s ease-in-out infinite;
                        flex-shrink: 0;
                }

                @keyframes dotPulse {

                        0%,
                        100% {
                                opacity: 1;
                        }

                        50% {
                                opacity: 0.3;
                        }
                }

                .idle-center {
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        flex: 1;
                        justify-content: center;
                        padding: 28px 24px;
                        width: 100%;
                        max-width: 420px;
                }

                .hero-icon {
                        width: 72px;
                        height: 72px;
                        border-radius: 50%;
                        background: linear-gradient(145deg, rgba(47, 128, 255, 0.15), rgba(0, 212, 255, 0.08));
                        border: 1px solid rgba(47, 128, 255, 0.2);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        margin-bottom: 28px;
                        box-shadow: 0 0 0 12px rgba(47, 128, 255, 0.04), 0 0 40px rgba(47, 128, 255, 0.1);
                        animation: heroFloat 4s ease-in-out infinite;
                }

                .hero-icon svg {
                        width: 32px;
                        height: 32px;
                }

                @keyframes heroFloat {

                        0%,
                        100% {
                                transform: translateY(0);
                        }

                        50% {
                                transform: translateY(-5px);
                        }
                }

                .headline {
                        text-align: center;
                        margin-bottom: 32px;
                }

                .headline h1 {
                        margin: 0 0 8px;
                        font-size: 30px;
                        font-weight: 800;
                        letter-spacing: -0.5px;
                        background: linear-gradient(150deg, #ffffff 0%, rgba(160, 200, 255, 0.9) 60%, rgba(0, 212, 255, 0.7) 100%);
                        -webkit-background-clip: text;
                        -webkit-text-fill-color: transparent;
                        background-clip: text;
                }

                .headline p {
                        margin: 0;
                        font-size: 11px;
                        color: var(--text-dim);
                        letter-spacing: 2.5px;
                        text-transform: uppercase;
                }

                #quickPassContainer {
                        display: none;
                        width: 100%;
                        background: var(--card);
                        border: 1px solid var(--border);
                        border-radius: var(--radius-lg);
                        padding: 20px;
                        margin-bottom: 16px;
                        transition: border-color 0.3s ease;
                        animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
                }

                @keyframes slideUp {
                        from {
                                opacity: 0;
                                transform: translateY(16px) scale(0.97);
                        }

                        to {
                                opacity: 1;
                                transform: none;
                        }
                }

                .qp-header {
                        display: flex;
                        align-items: center;
                        gap: 8px;
                        margin-bottom: 14px;
                }

                .qp-icon {
                        width: 30px;
                        height: 30px;
                        border-radius: 8px;
                        background: linear-gradient(135deg, rgba(47, 128, 255, 0.2), rgba(0, 212, 255, 0.15));
                        border: 1px solid rgba(47, 128, 255, 0.2);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                }

                .qp-icon svg {
                        width: 15px;
                        height: 15px;
                }

                .qp-label {
                        font-size: 10px;
                        letter-spacing: 1.5px;
                        text-transform: uppercase;
                        color: var(--blue);
                        font-weight: 700;
                }

                #quickPassTitle {
                        font-size: 17px;
                        font-weight: 700;
                        color: var(--text);
                        margin-bottom: 4px;
                }

                #quickPassSub {
                        font-size: 13px;
                        color: var(--text-sub);
                        margin-bottom: 18px;
                        line-height: 1.5;
                }

                .btn-quick {
                        width: 100%;
                        padding: 14px;
                        border-radius: var(--radius-md);
                        background: linear-gradient(135deg, #2f80ff 0%, #1a6aff 100%);
                        color: white;
                        font-size: 15px;
                        font-weight: 700;
                        border: none;
                        cursor: pointer;
                        box-shadow: 0 4px 20px rgba(47, 128, 255, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.15);
                        transition: all 0.2s ease;
                        letter-spacing: 0.3px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        gap: 8px;
                }

                .btn-quick svg {
                        width: 16px;
                        height: 16px;
                }

                .btn-quick:hover {
                        box-shadow: 0 6px 28px rgba(47, 128, 255, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
                        transform: translateY(-1px);
                }

                .btn-quick:active {
                        transform: scale(0.97);
                        box-shadow: 0 2px 12px rgba(47, 128, 255, 0.25);
                }

                .btn-quick:disabled {
                        background: rgba(255, 255, 255, 0.07);
                        color: var(--text-dim);
                        box-shadow: none;
                        cursor: default;
                        transform: none;
                }

                #callHint {
                        display: none;
                        font-size: 12px;
                        color: var(--text-dim);
                        text-align: center;
                        margin-bottom: 20px;
                        letter-spacing: 0.3px;
                }

                .call-wrap {
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        gap: 14px;
                        width: 100%;
                }

                .call-ripple {
                        position: relative;
                        width: 88px;
                        height: 88px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                }

                .call-ripple::before,
                .call-ripple::after {
                        content: '';
                        position: absolute;
                        border-radius: 50%;
                        border: 1.5px solid rgba(47, 128, 255, 0.3);
                        animation: rippleOut 2.8s ease-out infinite;
                }

                .call-ripple::after {
                        animation-delay: 1.4s;
                }

                @keyframes rippleOut {
                        0% {
                                width: 88px;
                                height: 88px;
                                opacity: 0.6;
                        }

                        100% {
                                width: 150px;
                                height: 150px;
                                opacity: 0;
                        }
                }

                #callBtn {
                        position: relative;
                        z-index: 1;
                        width: 88px;
                        height: 88px;
                        border-radius: 50%;
                        background: linear-gradient(145deg, #2f80ff, #1a5fdd);
                        color: white;
                        border: none;
                        cursor: pointer;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        box-shadow: 0 8px 32px rgba(47, 128, 255, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
                        transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
                }

                #callBtn svg {
                        width: 32px;
                        height: 32px;
                }

                #callBtn:hover {
                        transform: scale(1.06);
                        box-shadow: 0 12px 40px rgba(47, 128, 255, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
                }

                #callBtn:active {
                        transform: scale(0.93);
                }

                #callBtnLabel {
                        font-size: 13px;
                        color: var(--text-sub);
                        letter-spacing: 0.5px;
                }

                #idleStatus {
                        font-size: 13px;
                        color: var(--text-dim);
                        text-align: center;
                        padding: 0 24px;
                }

                #callingOverlay {
                        display: none;
                        position: fixed;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        background: var(--bg);
                        flex-direction: column;
                        align-items: center;
                        z-index: 999;
                        opacity: 0;
                        transition: opacity 0.32s ease;
                }

                #callingOverlay.visible {
                        opacity: 1;
                }

                #callingHeader {
                        width: 100%;
                        flex-shrink: 0;
                        display: flex;
                        align-items: center;
                        justify-content: space-between;
                        padding: 52px 24px 0;
                }

                #callingBrand {
                        display: flex;
                        align-items: center;
                        gap: 9px;
                }

                .calling-logo-mark {
                        width: 26px;
                        height: 26px;
                        background: linear-gradient(135deg, #2f80ff, #00d4ff);
                        border-radius: 7px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        box-shadow: 0 2px 8px rgba(47, 128, 255, 0.3);
                }

                .calling-logo-mark svg {
                        width: 14px;
                        height: 14px;
                }

                .calling-brand-name {
                        font-size: 14px;
                        font-weight: 700;
                        color: rgba(232, 238, 255, 0.4);
                }

                .timer-wrap {
                        display: flex;
                        align-items: center;
                        gap: 6px;
                }

                .timer-dot {
                        width: 5px;
                        height: 5px;
                        border-radius: 50%;
                        background: var(--red);
                        box-shadow: 0 0 6px var(--red);
                        animation: dotPulse 1.2s ease-in-out infinite;
                }

                #callTimer {
                        font-size: 13px;
                        color: var(--text-dim);
                        font-variant-numeric: tabular-nums;
                        letter-spacing: 1.5px;
                }

                #callingSubtitles {
                        width: 100%;
                        max-width: 500px;
                        flex: 1;
                        overflow-y: auto;
                        padding: 24px 20px 12px;
                        display: flex;
                        flex-direction: column;
                        gap: 10px;
                        scroll-behavior: smooth;
                }

                #callingSubtitles::-webkit-scrollbar {
                        display: none;
                }

                .sub-msg {
                        max-width: 82%;
                        padding: 12px 16px;
                        border-radius: 18px;
                        font-size: 15px;
                        line-height: 1.65;
                        word-break: break-all;
                        animation: bubbleIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) both;
                }

                @keyframes bubbleIn {
                        from {
                                opacity: 0;
                                transform: scale(0.88) translateY(8px);
                        }

                        to {
                                opacity: 1;
                                transform: none;
                        }
                }

                .sub-label {
                        font-size: 10px;
                        font-weight: 700;
                        letter-spacing: 1.2px;
                        text-transform: uppercase;
                        margin-bottom: 5px;
                        color: var(--text-dim);
                }

                .sub-ai {
                        background: rgba(255, 255, 255, 0.04);
                        border: 1px solid rgba(255, 255, 255, 0.07);
                        color: var(--text);
                        align-self: flex-start;
                        border-bottom-left-radius: 5px;
                }

                .sub-user {
                        background: linear-gradient(135deg, rgba(47, 128, 255, 0.55), rgba(26, 95, 221, 0.6));
                        color: white;
                        align-self: flex-end;
                        border-bottom-right-radius: 5px;
                        border: 1px solid rgba(47, 128, 255, 0.25);
                }

                .sub-user .sub-label {
                        text-align: right;
                }

                #callingCenter {
                        flex-shrink: 0;
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        padding: 16px 0 10px;
                }

                .avatar-orbit {
                        position: relative;
                        width: 120px;
                        height: 120px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                }

                .avatar-orbit::before {
                        content: '';
                        position: absolute;
                        border-radius: 50%;
                        border: 1px solid rgba(47, 128, 255, 0.15);
                        width: 110px;
                        height: 110px;
                        animation: orbitSpin 8s linear infinite;
                }

                .avatar-orbit::after {
                        content: '';
                        position: absolute;
                        border-radius: 50%;
                        border: 1px dashed rgba(47, 128, 255, 0.08);
                        width: 120px;
                        height: 120px;
                        animation: orbitSpin 12s linear infinite reverse;
                }

                @keyframes orbitSpin {
                        from {
                                transform: rotate(0deg);
                        }

                        to {
                                transform: rotate(360deg);
                        }
                }

                .avatar-ring {
                        position: relative;
                        z-index: 1;
                        width: 88px;
                        height: 88px;
                        border-radius: 50%;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                }

                .avatar-inner {
                        width: 66px;
                        height: 66px;
                        border-radius: 50%;
                        background: linear-gradient(145deg, #2f80ff, #1a5fdd);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        box-shadow: 0 6px 28px rgba(47, 128, 255, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
                        transition: background 0.5s ease, box-shadow 0.5s ease;
                }

                .avatar-inner svg {
                        width: 28px;
                        height: 28px;
                }

                .avatar-ring {
                        animation: ringIdle 2.8s ease-out infinite;
                }

                @keyframes ringIdle {
                        0% {
                                box-shadow: 0 0 0 0 rgba(47, 128, 255, 0.35);
                        }

                        70% {
                                box-shadow: 0 0 0 24px rgba(47, 128, 255, 0);
                        }

                        100% {
                                box-shadow: 0 0 0 0 rgba(47, 128, 255, 0);
                        }
                }

                @keyframes ringSpeaking {
                        0% {
                                box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.5);
                        }

                        55% {
                                box-shadow: 0 0 0 20px rgba(0, 230, 118, 0);
                        }

                        100% {
                                box-shadow: 0 0 0 0 rgba(0, 230, 118, 0);
                        }
                }

                .avatar-ring.speaking {
                        animation: ringSpeaking 0.9s ease-out infinite;
                }

                .avatar-ring.speaking .avatar-inner {
                        background: linear-gradient(145deg, #00c853, #009e3f);
                        box-shadow: 0 6px 28px rgba(0, 200, 83, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.2);
                }

                .wave-bars {
                        display: flex;
                        align-items: center;
                        gap: 3px;
                        height: 20px;
                        margin-top: 12px;
                        opacity: 0;
                        transition: opacity 0.3s ease;
                }

                .wave-bars.active {
                        opacity: 1;
                }

                .wave-bar {
                        width: 3px;
                        border-radius: 2px;
                        background: var(--green);
                        animation: waveAnim 0.9s ease-in-out infinite;
                }

                .wave-bar:nth-child(1) {
                        animation-delay: 0s;
                        height: 6px;
                }

                .wave-bar:nth-child(2) {
                        animation-delay: 0.15s;
                        height: 14px;
                }

                .wave-bar:nth-child(3) {
                        animation-delay: 0.3s;
                        height: 20px;
                }

                .wave-bar:nth-child(4) {
                        animation-delay: 0.15s;
                        height: 14px;
                }

                .wave-bar:nth-child(5) {
                        animation-delay: 0s;
                        height: 6px;
                }

                @keyframes waveAnim {

                        0%,
                        100% {
                                transform: scaleY(0.35);
                                opacity: 0.5;
                        }

                        50% {
                                transform: scaleY(1);
                                opacity: 1;
                        }
                }

                #callStatusText {
                        font-size: 12px;
                        color: var(--text-dim);
                        margin-top: 10px;
                        letter-spacing: 0.5px;
                }

                #hangupArea {
                        flex-shrink: 0;
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        padding: 4px 0 max(52px, env(safe-area-inset-bottom, 52px));
                }

                #hangupBtn {
                        width: 60px;
                        height: 60px;
                        border-radius: 50%;
                        background: rgba(255, 68, 68, 0.1);
                        border: 1px solid rgba(255, 68, 68, 0.25);
                        color: var(--red);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        cursor: pointer;
                        transition: all 0.18s ease;
                        box-shadow: 0 4px 20px rgba(255, 68, 68, 0.1);
                }

                #hangupBtn svg {
                        width: 24px;
                        height: 24px;
                }

                #hangupBtn:hover {
                        background: rgba(255, 68, 68, 0.18);
                        box-shadow: 0 6px 28px rgba(255, 68, 68, 0.2);
                        transform: scale(1.05);
                }

                #hangupBtn:active {
                        background: rgba(255, 68, 68, 0.28);
                        transform: scale(0.9);
                }

                #hangupLabel {
                        color: var(--text-dim);
                        font-size: 11px;
                        margin-top: 9px;
                        letter-spacing: 0.5px;
                }
        </style>
</head>

<body>

                        <div class="logo">
                                <div class="logo-mark">

                <div class="idle-center">

                                </svg>
                        </div>

                        <div class="headline">
                                <h1>入园登记</h1>
                                <p>Smart Gatehouse &middot; AI Powered</p>
                        </div>

                        <div id="quickPassContainer">
                                <div class="qp-header">
                                        <div class="qp-icon">
                                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                        <path d="M13 3L6 14H12L11 21L18 10H12L13 3Z" stroke="#2f80ff"
                                                                stroke-width="1.8" stroke-linejoin="round" />
                                                </svg>
                                        </div>
                                        <div class="qp-label">快速通行</div>
                                </div>
                                <div id="quickPassTitle">一键入园</div>
                                <div id="quickPassSub"></div>
                                <button class="btn-quick" id="quickPassBtn">
                                        一键放行
                                </button>
                        </div>

                        <div id="callHint">或通过语音呼叫门卫</div>

                        <div class="call-wrap">
                                <div class="call-ripple">
                                        <button id="callBtn">
                                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                        <rect x="9" y="2" width="6" height="11" rx="3" stroke="white"
                                                                stroke-width="2" />
                                                        <path d="M5 10C5 14.4 8.1 18 12 18C15.9 18 19 14.4 19 10"
                                                                stroke="white" stroke-width="2"
                                                                stroke-linecap="round" />
                                                        <line x1="12" y1="18" x2="12" y2="22" stroke="white"
                                                                stroke-width="2" stroke-linecap="round" />
                                                        <line x1="8" y1="22" x2="16" y2="22" stroke="white"
                                                                stroke-width="2" stroke-linecap="round" />
                                                </svg>
                                        </button>
                                </div>
                                <div id="callBtnLabel">点击呼叫</div>
                        </div>
                </div>

                <div id="idleStatus">准备就绪</div>
        </div>

        <div id="callingOverlay">
                <div id="callingHeader">
                        <div id="callingBrand">
                                <div class="calling-logo-mark">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
                                                <path fill="#FFFFFF"
                                                        d="M14.475 11.975Q15.5 10.95 15.5 9.5t-1.025-2.475T12 6T9.525 7.025T8.5 9.5t1.025 2.475T12 13t2.475-1.025M12 22q-3.65-.925-5.825-4T4 11.1V5l8-3l8 3v6.1q0 3.825-2.175 6.9T12 22m0-2.1q1.475-.475 2.613-1.487t1.987-2.288q-1.075-.55-2.238-.837T12 15t-2.363.288t-2.237.837q.85 1.275 1.988 2.288T12 19.9" />
                                        </svg>
                                </div>
                                <div class="calling-brand-name">AI 门卫室</div>
                        </div>
                        <div class="timer-wrap">
                                <div class="timer-dot"></div>
                                <span id="callTimer">00:00</span>
                        </div>
                </div>

                <div id="callingSubtitles"></div>

                <div id="callingCenter">
                        <div class="avatar-orbit">
                                <div class="avatar-ring" id="avatarRing">
                                        <div class="avatar-inner">
                                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                        <rect x="9" y="2" width="6" height="11" rx="3" stroke="white" stroke-width="2" />
                                                        <path d="M5 10C5 14.4 8.1 18 12 18C15.9 18 19 14.4 19 10" stroke="white" stroke-width="2"
                                                                stroke-linecap="round" />
                                                        <line x1="12" y1="18" x2="12" y2="22" stroke="white" stroke-width="2" stroke-linecap="round" />
                                                        <line x1="8" y1="22" x2="16" y2="22" stroke="white" stroke-width="2" stroke-linecap="round" />
                                                </svg>
                                        </div>
                                </div>
                        </div>
                        <div class="wave-bars" id="waveBars">
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                        </div>
                        <div id="callStatusText">正在连接...</div>
                </div>

                <div id="hangupArea">
                        <button id="hangupBtn">
                                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 48 48">
                                        <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="3">
                                                <path stroke-linejoin="round"
                                                        d="M28.643 28.641a20 20 0 0 0 4.997-8.321c.203-.668-.005-1.385-.498-1.878l-3.077-3.077a4 4 0 0 1-.885-4.314l2.466-6.165A3 3 0 0 1 34.43 3H35c5.523 0 10 4.477 10 10v1.332q0 .008-.006.013a.02.02 0 0 0-.005.013c-.223 8.339-3.687 15.87-9.178 21.379M24.19 32a20 20 0 0 1-3.87 1.64c-.668.203-1.385-.005-1.878-.498l-3.077-3.077a4 4 0 0 0-4.314-.885l-6.165 2.466A3 3 0 0 0 3 34.43V35c0 5.523 4.477 10 10 10h.5a31.35 31.35 0 0 0 18-5.646" />
                                                <path d="m9 9l36 36" />
                                        </g>
                                </svg>
                        </button>
                        <div id="hangupLabel">挂断</div>
                </div>
        </div>

        <script>
                var userUuid = localStorage.getItem('visitor_uuid');
                if (!userUuid) {
                        userUuid = 'usr-' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
                        localStorage.setItem('visitor_uuid', userUuid);
                }

                var callBtn = document.getElementById('callBtn');
                var callBtnLabel = document.getElementById('callBtnLabel');
                var idleStatus = document.getElementById('idleStatus');
                var callingOverlay = document.getElementById('callingOverlay');
                var idlePage = document.getElementById('idlePage');
                var callingSubtitles = document.getElementById('callingSubtitles');
                var avatarRing = document.getElementById('avatarRing');
                var waveBars = document.getElementById('waveBars');
                var callStatusText = document.getElementById('callStatusText');

                var ws = null, audioContext = null, mediaStreamSource = null, processor = null;
                var playCtx = null, nextPlayTime = 0, audioMuted = false, visitorData = null;
                var callTimerInterval = null, callSeconds = 0;
                var currentAiMsgNode = null;

                // 全双工打断：VAD 状态变量
                var isAiSpeaking = false;      // AI 是否正在播放 TTS 音频
                var vadAboveThreshold = false; // 当前帧是否超过阴値
                var vadStartTime = 0;          // 首次超阙値的时间戳
                var VAD_THRESHOLD = 0.012;     // RMS 音量阙値（范围 0–1）
                var VAD_DURATION_MS = 300;     // 持续超阙値需要的毫秒数

                function startCallTimer() {
                        callSeconds = 0;
                        document.getElementById('callTimer').innerText = '00:00';
                        callTimerInterval = setInterval(function () {
                                callSeconds++;
                                var m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
                                var s = String(callSeconds % 60).padStart(2, '0');
                                document.getElementById('callTimer').innerText = m + ':' + s;
                        }, 1000);
                }
                function stopCallTimer() {
                        if (callTimerInterval) { clearInterval(callTimerInterval); callTimerInterval = null; }
                }

                fetch('/api/visitor/' + userUuid)
                        .then(function (r) { return r.json(); })
                        .then(function (data) {
                                if (data.is_old) {
                                        visitorData = data;
                                        document.getElementById('quickPassContainer').style.display = 'block';
                                        document.getElementById('quickPassTitle').innerText = '欢迎回来' + (data.name ? '，' + data.name : '');
                                        document.getElementById('quickPassSub').innerText = data.reason;
                                        document.getElementById('callHint').style.display = 'block';
                                }
                        }).catch(function (e) { console.error('获取访客信息失败', e); });

                document.getElementById('quickPassBtn').addEventListener('click', function () {
                        if (!visitorData) return;
                        var btn = document.getElementById('quickPassBtn');
                        document.getElementById('quickPassTitle').innerText = '正在登记...';
                        document.getElementById('quickPassSub').innerText = '请稍候';
                        btn.disabled = true;
                        fetch('/api/visitor/quick_pass', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                        user_uuid: userUuid, name: visitorData.name, phone: visitorData.phone,
                                        plate: visitorData.plate, company: visitorData.company, reason: visitorData.reason
                                })
                        }).then(function (r) { return r.json(); }).then(function () {
                                idleStatus.innerText = '登记完成，请直接通行！';
                                document.getElementById('quickPassTitle').innerText = '已放行';
                                document.getElementById('quickPassSub').innerText = '已记录您的访客信息，请耐心等待门卫审核';
                                document.querySelector('.call-ripple').style.display = 'none';
                                callBtnLabel.style.display = 'none';
                                document.getElementById('callHint').style.display = 'none';
                        }).catch(function () {
                                document.getElementById('quickPassTitle').innerText = '登记失败，请重试';
                                document.getElementById('quickPassSub').innerText = '或点击呼叫门卫';
                                btn.disabled = false;
                        });
                });

                function appendAiText(text) {
                        if (!currentAiMsgNode) {
                                currentAiMsgNode = document.createElement('div');
                                currentAiMsgNode.className = 'sub-msg sub-ai';
                                currentAiMsgNode.innerHTML = '<div class="sub-label">门卫 AI</div><span></span>';
                                callingSubtitles.appendChild(currentAiMsgNode);
                        }
                        currentAiMsgNode.querySelector('span').innerText += text;
                        callingSubtitles.scrollTop = callingSubtitles.scrollHeight;
                        avatarRing.classList.add('speaking');
                        waveBars.classList.add('active');
                }
                function endAiText() {
                        currentAiMsgNode = null;
                        avatarRing.classList.remove('speaking');
                        waveBars.classList.remove('active');
                }
                function appendUserText(text) {
                        currentAiMsgNode = null;
                        avatarRing.classList.remove('speaking');
                        waveBars.classList.remove('active');
                        var div = document.createElement('div');
                        div.className = 'sub-msg sub-user';
                        div.innerHTML = '<div class="sub-label">我</div><span>' + text + '</span>';
                        callingSubtitles.appendChild(div);
                        callingSubtitles.scrollTop = callingSubtitles.scrollHeight;
                }

                function stopAudioQueue() {
                        audioMuted = true;
                        isAiSpeaking = false;
                        vadAboveThreshold = false;
                        if (playCtx) { playCtx.close(); playCtx = null; nextPlayTime = 0; }
                }

                function enterCallingMode() {
                        callingSubtitles.innerHTML = ''; currentAiMsgNode = null; audioMuted = false;
                        avatarRing.classList.remove('speaking');
                        waveBars.classList.remove('active');
                        callStatusText.innerText = '正在连接...';
                        idlePage.classList.add('fading-out');
                        setTimeout(function () {
                                idlePage.style.display = 'none'; idlePage.classList.remove('fading-out');
                                callingOverlay.style.display = 'flex';
                                void callingOverlay.offsetWidth; callingOverlay.classList.add('visible');
                                startCallTimer();
                        }, 320);
                }
                function exitCallingMode(message) {
                        stopCallTimer(); callingOverlay.classList.remove('visible');
                        setTimeout(function () {
                                callingOverlay.style.display = 'none';
                                if (message) idleStatus.innerText = message;
                                idlePage.style.display = 'flex';
                        }, 320);
                }

                callBtn.addEventListener('click', async function () {
                        if (ws && ws.readyState === WebSocket.OPEN) { cleanup(true); return; }
                        document.getElementById('quickPassContainer').style.display = 'none';
                        document.getElementById('callHint').style.display = 'none';
                        enterCallingMode();
                        try {
                                var stream = await navigator.mediaDevices.getUserMedia({
                                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                                });
                                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                                mediaStreamSource = audioContext.createMediaStreamSource(stream);
                                processor = audioContext.createScriptProcessor(4096, 1, 1);
                                mediaStreamSource.connect(processor); processor.connect(audioContext.destination);

                                var protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                                ws = new WebSocket(protocol + '//' + location.host + '/ws/voice/' + userUuid);

                                ws.onopen = function () {
                                        callStatusText.innerText = '通话中';
                                        processor.onaudioprocess = function (e) {
                                                if (!ws || ws.readyState !== WebSocket.OPEN) return;
                                                var f32 = e.inputBuffer.getChannelData(0);

                                                // 全双工 VAD：AI 播音期间检测用户是否开口说话
                                                if (isAiSpeaking) {
                                                        var sumSq = 0;
                                                        for (var vi = 0; vi < f32.length; vi++) sumSq += f32[vi] * f32[vi];
                                                        var rms = Math.sqrt(sumSq / f32.length);
                                                        if (rms > VAD_THRESHOLD) {
                                                                if (!vadAboveThreshold) {
                                                                        vadAboveThreshold = true;
                                                                        vadStartTime = Date.now();
                                                                } else if (Date.now() - vadStartTime >= VAD_DURATION_MS) {
                                                                        // 持续超阙値 300ms → 发送打断信令
                                                                        if (ws && ws.readyState === WebSocket.OPEN) {
                                                                                ws.send(JSON.stringify({ action: 'interrupt' }));
                                                                        }
                                                                        isAiSpeaking = false;   // 防止重复触发
                                                                        vadAboveThreshold = false;
                                                                }
                                                        } else {
                                                                vadAboveThreshold = false;
                                                        }
                                                }

                                                // 转换为 16-bit PCM 并发送给后端
                                                var i16 = new Int16Array(f32.length);
                                                for (var i = 0; i < f32.length; i++) {
                                                        var s = Math.max(-1, Math.min(1, f32[i]));
                                                        i16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                                                }
                                                ws.send(i16.buffer);
                                        };
                                };

                                ws.onmessage = async function (event) {
                                        if (event.data instanceof Blob) {
                                                if (audioMuted) return;
                                                // AI 正在播放音频，更新 VAD 状态
                                                isAiSpeaking = true;
                                                vadAboveThreshold = false;
                                                var ab = await event.data.arrayBuffer();
                                                var i16 = new Int16Array(ab);
                                                var f32 = new Float32Array(i16.length);
                                                for (var i = 0; i < i16.length; i++) f32[i] = i16[i] / 0x8000;
                                                if (!playCtx) { playCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 }); nextPlayTime = playCtx.currentTime; }
                                                if (nextPlayTime < playCtx.currentTime) nextPlayTime = playCtx.currentTime;
                                                var buf = playCtx.createBuffer(1, f32.length, 24000);
                                                buf.getChannelData(0).set(f32);
                                                var src = playCtx.createBufferSource(); src.buffer = buf; src.connect(playCtx.destination);
                                                src.start(nextPlayTime); nextPlayTime += buf.duration;
                                        } else if (typeof event.data === 'string') {
                                                var dat = JSON.parse(event.data);
                                                if (dat.status === 'completed') {
                                                        callStatusText.innerText = '登记完成';
                                                        setTimeout(function () { cleanup(false); exitCallingMode('登记完成，请通行！'); }, 2500);
                                                } else if (dat.type === 'ai_text') { appendAiText(dat.text); }
                                                else if (dat.type === 'ai_end') {
                                                        endAiText();
                                                        isAiSpeaking = false;   // AI 已说完，关闭 VAD
                                                        vadAboveThreshold = false;
                                                }
                                                else if (dat.type === 'user_text') {
                                                        appendUserText(dat.text);
                                                        // 用户说完话，新一轮 AI 响应即将到来，恢复音频播放
                                                        audioMuted = false;
                                                }
                                                else if (dat.type === 'stop_audio') {
                                                        stopAudioQueue();
                                                        // isAiSpeaking/vadAboveThreshold 已在 stopAudioQueue 里重置
                                                }
                                                else if (dat.type === 'resume_audio') {
                                                        // 数据校验失败后后端主动解锁音频，确保下一轮 AI TTS 能正常播放
                                                        audioMuted = false;
                                                }
                                                else if (dat.type === 'retract_ai_text') {
                                                        // 撤回当前 AI 消息气泡（校验拦截时清除预-JSON 的矛盾话语）
                                                        if (currentAiMsgNode && currentAiMsgNode.parentNode) {
                                                                currentAiMsgNode.parentNode.removeChild(currentAiMsgNode);
                                                        }
                                                        currentAiMsgNode = null;
                                                        avatarRing.classList.remove('speaking');
                                                        waveBars.classList.remove('active');
                                                }
                                                else if (dat.type === 'hang_up') {
                                                        callStatusText.innerText = '正在转接人工服务';
                                                        isAiSpeaking = false;
                                                        stopAudioQueue();
                                                        setTimeout(function () { cleanup(false); exitCallingMode('已通知人工，请稍候'); }, 2000);
                                                }
                                        }
                                };
                                ws.onclose = function () { cleanup(false); };
                                ws.onerror = function (e) { console.error('WS错误', e); cleanup(false); exitCallingMode('连接发生错误'); };
                        } catch (err) {
                                console.error(err);
                                var msg = err.name === 'NotAllowedError' ? '需允许麦克风权限' : '连接失败: ' + err.message;
                                cleanup(false); exitCallingMode(msg);
                                if (visitorData) {
                                        document.getElementById('quickPassContainer').style.display = 'block';
                                        document.getElementById('callHint').style.display = 'block';
                                }
                        }
                });

                document.getElementById('hangupBtn').addEventListener('click', function () { cleanup(true); });

                function cleanup(showEnded) {
                        stopCallTimer();
                        isAiSpeaking = false;
                        vadAboveThreshold = false;
                        waveBars.classList.remove('active');
                        if (playCtx) { playCtx.close(); playCtx = null; nextPlayTime = 0; }
                        if (processor) { processor.disconnect(); processor = null; }
                        if (mediaStreamSource) { mediaStreamSource.disconnect(); mediaStreamSource = null; }
                        if (audioContext && audioContext.state !== 'closed') { audioContext.close(); audioContext = null; }
                        if (ws) { if (ws.readyState === WebSocket.OPEN) ws.close(); ws = null; }
                        audioMuted = false;
                        if (showEnded) exitCallingMode('通话已结束');
                }
        </script>
</body>

</html>
